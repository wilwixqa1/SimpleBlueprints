# SimpleBlueprints CI
#
# Runs on every push and PR to main. Railway autodeploys from main with no gate,
# so this is the tripwire: a red X here means the deploy that just went out is
# suspect. (Gating the deploy itself on green is a later step: deploy from a
# release branch that only advances when this passes.)
#
# S103: this file had drifted badly. It ran 11 invocations and omitted NINE
# suites from the documented gate, including golden_structural,
# test_frontend_parity and test_cross_system_consistency -- the three that
# caught S102's real bugs. It also omitted legibility_gate.py, which appeared in
# no gate list anywhere. Last touched 2026-07-23; the gate grew for three
# sessions without it.
#
# DO NOT hand-maintain the list below against a handoff document. That is how it
# drifted: each handoff copied the previous one. tests/test_gate_completeness.py
# now fails the build if any suite in tests/ is missing from this file, so add
# the step and the guard will confirm it. It runs FIRST so a wiring mistake is
# the first thing you see, not the last.
#
# The full local gate is this same list. Golden MUST run with SBP_SHEET=arch_d;
# bare it fails with everything scaled by 2.571 (36/14), which is a sheet-size
# signature, not a regression.
name: tests

on:
  push:
    branches: [main, s84]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # legibility_check.py and render_review.py shell out to pdftoppm. It is a
      # SYSTEM package, not a pip one, and its absence is what failed the second
      # CI run of S103 after the pdfminer fix. test_gate_completeness now checks
      # for external binaries too, so this list is verified rather than
      # remembered.
      - name: Install system deps (pdftoppm, used to rasterize sheets)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # matplotlib/numpy are pinned: the linework baseline is version-sensitive
      # (S87). The rest are app imports -- app.main pulls stripe/fastapi/psycopg2
      # transitively, so the PDF suites need them even though they never touch a
      # payment or a database.
      - name: Install Python deps
        run: |
          pip install matplotlib==3.10.8 numpy==2.4.4
          pip install reportlab pypdf pillow httpx python-multipart itsdangerous \
                      anthropic fastapi stripe psycopg2-binary pdfminer.six \
                      pgserver

      # S104: real Postgres (pgserver ships its own binary, ~2s to boot). The
      # analytics queries cannot be verified any other way -- they use FILTER,
      # JSONB ->> and BOOL_OR, none of which sqlite understands, and wrong
      # analytics never throw. Two real bugs were caught writing this.
      - name: Address-lookup analytics (real Postgres, shipped get_analytics_v2)
        run: python3 tests/test_lookup_analytics.py

      # S104: the project id lived only in a React ref, so refresh / sign-in /
      # going home dropped it and the next autosave created a duplicate row.
      # The client now keeps it in the URL; this guards the server backstop.
      - name: Project duplicate backstop (real Postgres)
        run: python3 tests/test_project_dedupe.py

      # S104: the HTML shells name the cache-busted bundle versions and cannot
      # bust themselves. Without no-cache a browser reuses a stale shell and
      # never receives a deploy. This happened for real in S104 push 5.
      - name: Cache headers on HTML shells (real app via TestClient)
        run: python3 tests/test_cache_headers.py

      # S104: Twitter wraps every posted link in a per-link t.co code, so one
      # account fragments into many referrer rows. Also asserts our own OAuth
      # round trip is not counted as organic search.
      - name: Referrer source grouping (real Postgres)
        run: python3 tests/test_referrer_grouping.py

      # S104: /x style short links attach UTMs server-side so posted URLs stay
      # clean. Guards the collision check (a bad code must break the deploy,
      # not the dashboard) and 302-not-301.
      - name: Branded short links (real app via TestClient)
        run: python3 tests/test_short_links.py

      # ---- wiring guard -------------------------------------------------
      # S105: "zone" is printed on the permit sheets and it already means
      # ZONING DISTRICT there. Renamed to Deck A/B/C, and the naming rule that
      # was inline in eight places now lives in one function per language.
      # This guards the two against drifting apart again.
      - name: Section naming parity (zoneUtils.js vs zone_utils.py)
        run: python3 tests/test_section_naming_parity.py

      - name: Gate completeness (every suite in tests/ is wired into this file)
        run: python3 tests/test_gate_completeness.py

      # ---- fast suites first: fail early, cheaply -----------------------
      - name: Geometry invariants (site plan math, 2700+ checks)
        run: node tests/geometry/lotGeometry.test.js

      - name: Stair deck-plane footprint (S100 P0-3D, straight-stair invariant)
        run: node tests/test_stair_footprint.js

      - name: Beam/post layout, JS port (S101, notch-aware)
        run: node tests/test_beam_layout.js

      - name: Beam/post layout, Python (S90 coincident-post regression)
        run: python3 tests/test_beam_layout.py

      - name: Notch post placement
        run: python3 tests/test_notch_posts.py

      - name: Stair support assembly (S100, dedicated stair posts/header)
        run: python3 tests/test_stair_support.py

      - name: Structural verification (IRC known-answer tests, S60 baseline)
        run: python3 tests/test_structural.py

      - name: Post-to-grade consistency (S87, elevations invariant)
        run: python3 tests/test_post_grade.py

      - name: Frost/snow input normalization (S88 B9, calc-vs-checker agreement)
        run: python3 tests/test_frost_snow_normalize.py

      - name: Future products logic tests
        run: python3 tests/test_future_products.py

      - name: IRC deck table drift guard (S101, R507.5/R507.6 snapshot)
        run: python3 tests/test_irc_table_drift.py

      - name: Jurisdiction checklist
        run: python3 tests/test_jurisdiction_checklist.py

      - name: Steel framing labels
        run: python3 tests/test_steel_labels.py

      # ---- cross-system seams: the ones that catch real bugs ------------
      - name: Frontend/backend parity (JS vs Python, geometry + materials)
        run: python3 tests/test_frontend_parity.py

      - name: Cross-system consistency audit (S102/S103 seams)
        run: python3 tests/test_cross_system_consistency.py

      # ---- PDF suites: slowest, run last --------------------------------
      - name: Golden structural (28 sheet fingerprints, site/plan/framing/details)
        run: SBP_SHEET=arch_d python3 tests/pdf/golden_structural.py

      - name: Text-over-linework differential (S87 oracle, 2 canonical fixtures)
        run: SBP_SHEET=arch_d python3 tests/pdf/linework_check.py basic_rect_ledger zones_stairs_lcr

      - name: Panel-overflow differential G5/G6/G7 (S88 oracle, selftest + 2 fixtures)
        run: |
          python3 tests/pdf/panel_check.py --selftest
          SBP_SHEET=arch_d python3 tests/pdf/panel_check.py basic_rect_ledger zones_stairs_lcr

      - name: Config matrix + post-in-landing B3/G11 (S88, interior-anchored stair path)
        run: SBP_SHEET=arch_d python3 tests/pdf/config_matrix.py

      - name: Legibility gate (S93, zero text overlaps; site plans clean)
        run: SBP_SHEET=arch_d python3 tests/pdf/legibility_gate.py

      - name: Fuzz smoke (S87, 8 seeded configs, crash judge)
        run: SBP_SHEET=arch_d python3 tests/pdf/fuzz_configs.py 8
